<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>펜싱크루 서비스 종료</title>
  <style>
    :root {
      --bg: #fafaf8;
      --surface: #ffffff;
      --ink: #2f3438;
      --ink-soft: #5c6369;
      --ink-faint: #6e747a;
      --line: #e7e7e2;
      --accent-ink: #205d99;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181a;
        --surface: #1f2225;
        --ink: #eceeef;
        --ink-soft: #b7bcc0;
        --ink-faint: #9aa0a5;
        --line: #33373b;
        --accent-ink: #8cc0ef;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
      line-height: 1.7;
      word-break: keep-all;
    }
    main {
      width: 100%;
      max-width: 440px;
      padding: 32px 28px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .brand {
      margin: 0 0 24px;
      font-size: 15px;
      font-weight: 800;
      font-style: italic;
      letter-spacing: 0.02em;
      color: var(--accent-ink);
    }
    h1 {
      margin: 0 0 16px;
      font-size: 21px;
      line-height: 1.4;
      letter-spacing: -0.018em;
    }
    p {
      margin: 0 0 12px;
      font-size: 15px;
      color: var(--ink-soft);
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">FENCING CREW</p>
    <h1>펜싱크루 서비스가 종료되었습니다</h1>
    <p>펜싱크루는 펜싱이 더 많은 사람에게 닿기를 바라는 마음으로 개인이 시작한 서비스였습니다. 아쉽지만 본업에 집중하기 위해 서비스를 종료하게 되었습니다.</p>
    <p>그동안 펜싱크루를 찾아 주신 선수, 학부모, 클럽 관계자 여러분께 진심으로 감사드립니다.</p>
    <p>펜싱크루가 보관하던 회원 정보와 선수·대회 기록은 모두 파기합니다.</p>
  </main>
</body>
</html>
